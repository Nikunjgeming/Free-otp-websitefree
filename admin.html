<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - OTP Bot Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0e27;
            color: #fff;
        }

        .admin-nav {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            padding: 15px 0;
            border-bottom: 1px solid rgba(78, 205, 196, 0.3);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 30px;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
        }

        .logo i {
            color: #4ECDC4;
            margin-right: 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(78, 205, 196, 0.2);
        }

        .stat-card i {
            font-size: 32px;
            color: #4ECDC4;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
        }

        .stat-label {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
        }

        .orders-table {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        th {
            color: #4ECDC4;
            font-weight: 600;
        }

        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-pending {
            background: rgba(255, 165, 2, 0.2);
            color: #ffa502;
        }

        .status-completed {
            background: rgba(78, 205, 196, 0.2);
            color: #4ECDC4;
        }

        .status-cancelled {
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
        }

        .otp-code {
            font-family: monospace;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .refresh-btn {
            background: #4ECDC4;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            color: #0a0e27;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .search-admin {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            padding: 10px 15px;
            border-radius: 10px;
            color: white;
            width: 300px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <nav class="admin-nav">
        <div class="container">
            <div class="admin-header">
                <div class="logo">
                    <i class="fas fa-crown"></i> Admin Panel
                </div>
                <div>
                    <i class="fas fa-user-circle"></i> Administrator
                </div>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="stats-grid">
            <div class="stat-card">
                <i class="fas fa-chart-line"></i>
                <div class="stat-value" id="totalOrders">0</div>
                <div class="stat-label">Total Orders</div>
            </div>
            <div class="stat-card">
                <i class="fas fa-check-circle"></i>
                <div class="stat-value" id="completedOrders">0</div>
                <div class="stat-label">Completed</div>
            </div>
            <div class="stat-card">
                <i class="fas fa-clock"></i>
                <div class="stat-value" id="pendingOrders">0</div>
                <div class="stat-label">Pending</div>
            </div>
            <div class="stat-card">
                <i class="fas fa-wallet"></i>
                <div class="stat-value" id="totalRevenue">₹0</div>
                <div class="stat-label">Total Revenue</div>
            </div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2><i class="fas fa-list"></i> Order History</h2>
            <div>
                <input type="text" id="searchOrders" class="search-admin" placeholder="Search by number or OTP...">
                <button class="refresh-btn" onclick="loadOrders()">
                    <i class="fas fa-sync-alt"></i> Refresh
                </button>
            </div>
        </div>

        <div class="orders-table">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Phone Number</th>
                        <th>Service</th>
                        <th>Price</th>
                        <th>OTP Code</th>
                        <th>Status</th>
                        <th>Time</th>
                    </tr>
                </thead>
                <tbody id="ordersTableBody">
                    <tr><td colspan="7" style="text-align:center;">Loading orders...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function loadOrders() {
            const orders = JSON.parse(localStorage.getItem('adminOrders') || '[]');
            const searchTerm = document.getElementById('searchOrders')?.value.toLowerCase() || '';
            
            let filtered = orders;
            if (searchTerm) {
                filtered = orders.filter(o => 
                    o.number?.includes(searchTerm) || 
                    o.otp?.toString().includes(searchTerm)
                );
            }
            
            const total = orders.length;
            const completed = orders.filter(o => o.status === 'completed').length;
            const pending = orders.filter(o => o.status === 'pending').length;
            const revenue = orders.filter(o => o.status === 'completed').reduce((sum, o) => sum + parseFloat(o.price), 0);
            
            document.getElementById('totalOrders').innerText = total;
            document.getElementById('completedOrders').innerText = completed;
            document.getElementById('pendingOrders').innerText = pending;
            document.getElementById('totalRevenue').innerText = `₹${revenue.toFixed(2)}`;
            
            const tbody = document.getElementById('ordersTableBody');
            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">No orders found</td></tr>';
                return;
            }
            
            tbody.innerHTML = filtered.map(order => `
                <tr>
                    <td>${order.id?.substring(0, 8)}...</td>
                    <td><i class="fas fa-phone"></i> ${order.number || 'N/A'}</td>
                    <td><span style="color:#4ECDC4">${order.service?.toUpperCase() || 'N/A'}</span></td>
                    <td>₹${order.price || 0}</td>
                    <td class="otp-code">${order.otp || '—'}</td>
                    <td>
                        <span class="status-badge status-${order.status === 'completed' ? 'completed' : order.status === 'cancelled' ? 'cancelled' : 'pending'}">
                            ${order.status || 'pending'}
                        </span>
                    </td>
                    <td>${order.time || 'N/A'}</td>
                </tr>
            `).join('');
        }

        document.getElementById('searchOrders')?.addEventListener('keyup', loadOrders);
        
        loadOrders();
        setInterval(loadOrders, 10000);
    </script>
</body>
</html>
